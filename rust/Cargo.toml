[package]
name = "fpswatcher_core"
version = "1.0.0"
edition = "2021"
description = "Rust parsing and CSV export core for FPSWatcher"
license = "MIT"

[lib]
name = "fpswatcher_core"
crate-type = ["cdylib"]

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
